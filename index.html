<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Go Slow Lagos</title>
<meta name="theme-color" content="#F2B705">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="mark" aria-hidden="true"></span><div><h1>Go Slow</h1><small>Live Lagos traffic</small></div></div>
  <div class="legend" aria-label="Traffic colours"><span><i class="g"></i>Free</span><span><i class="o"></i>Slow</span><span><i class="r"></i>Jam</span></div>
</header>
<div id="banner" class="banner" hidden></div>
<div class="mapwrap">
  <div id="map" aria-label="Map of Lagos with live traffic"></div>
  <button id="locate" class="fab" aria-label="Show my location">◎</button>
</div>
<section class="sheet" aria-label="Traffic details">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="routes" aria-selected="true">My routes</button>
    <button class="tab" role="tab" data-tab="incidents" aria-selected="false">Incidents</button>
  </div>
  <div id="panel" class="panel"></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
